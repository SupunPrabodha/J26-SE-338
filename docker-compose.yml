name: j26-se-338-dev

x-platform-env: &platform-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Run the bootstrap script}
  PREPROCESSING_SECRET: ${PREPROCESSING_SECRET:?Run the bootstrap script}
  NLP_SECRET: ${NLP_SECRET:?Run the bootstrap script}
  XAI_SECRET: ${XAI_SECRET:?Run the bootstrap script}
  DEV_COUNSELLOR_USERNAME: ${DEV_COUNSELLOR_USERNAME}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

x-python: &python
  build:
    context: .
    dockerfile: infrastructure/docker/python.Dockerfile
  image: j26-platform:0.1.0-dev
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  networks: [internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: local
    options: { max-size: "5m", max-file: "2" }

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the bootstrap script}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?Run the bootstrap script}" }
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction']
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  orchestrator:
    <<: *python
    networks: [internal, edge]
    environment:
      <<: *platform-env
      SERVICE_NAME: orchestrator
      DEV_COUNSELLOR_PASSWORD: ${DEV_COUNSELLOR_PASSWORD}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD}
    ports: [127.0.0.1:8000:8000]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  preprocessing:
    <<: *python
    environment:
      SERVICE_NAME: preprocessing
      PREPROCESSING_SECRET: ${PREPROCESSING_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
  nlp:
    <<: *python
    environment:
      SERVICE_NAME: nlp
      NLP_SECRET: ${NLP_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
  xai:
    <<: *python
    environment:
      SERVICE_NAME: xai
      XAI_SECRET: ${XAI_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
  worker:
    <<: *python
    environment:
      <<: *platform-env
      SERVICE_NAME: worker
    command: [python, -m, orchestrator.worker]
    healthcheck:
      test: [CMD, python, -c, "from research_common.web import redis_client; assert redis_client().get('j26:worker:heartbeat')"]
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 5
    depends_on:
      orchestrator: { condition: service_healthy }
      preprocessing: { condition: service_healthy }
      nlp: { condition: service_healthy }
      xai: { condition: service_healthy }
  student-portal:
    image: j26-student-portal:0.1.0-dev
    environment: { PORT: "3000" }
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP: student-portal }
    ports: [127.0.0.1:3000:3000]
    networks: [internal, edge]
    restart: unless-stopped
    init: true
    depends_on:
      orchestrator: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
  counsellor-dashboard:
    image: j26-counsellor-dashboard:0.1.0-dev
    environment: { PORT: "3001" }
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP: counsellor-dashboard }
    ports: [127.0.0.1:3001:3001]
    networks: [internal, edge]
    restart: unless-stopped
    init: true
    depends_on:
      orchestrator: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s

networks:
  edge:
  internal:
    internal: true
volumes:
  postgres-data:
