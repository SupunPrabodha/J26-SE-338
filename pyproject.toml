[project]
name = "j26-research-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "pyjwt==2.15.1",
  "pwdlib[argon2]==0.3.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.1",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "spacy==3.8.16",
  "en-core-web-sm",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "jsonschema==4.26.0", "pip-audit==2.10.1", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
presidio-anonymizer = { git = "https://github.com/data-privacy-stack/presidio.git", subdirectory = "presidio-anonymizer", rev = "5e2fcea990aa3b99660d2aea9121d0ba74a8940b" }

[tool.pytest.ini_options]
pythonpath = ["packages/contracts/src", "packages/python-common/src", "services"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
